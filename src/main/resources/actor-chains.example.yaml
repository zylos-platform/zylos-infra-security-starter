###############################################################################
# Example actor-chains.yaml (Authorization model).
#
# Per-service file at classpath:/actor-chains.yaml. Declares which endpoints
# are public, which are chain-sensitive, and the permitted delegation chains
# for the sensitive ones.
#
# Authorization model (ADR 0003 refinement):
#   - Most endpoints authorize on a valid authenticated token alone. The actor
#     chain is recorded (and available for audit / OPA), but NOT matched.
#   - Sensitive endpoints opt into chain matching via `chainSensitive: true`.
#   - This aligns with industry norm (direct-actor authorization) while keeping
#     the chain validator available for the high-stakes subset.
#
# Permitted chains are written in chronological order (least-recent actor
# first). For a token whose nested act claim is:
#
#   "act": { "client_id": "zylos-internal-cart",
#            "act": { "client_id": "zylos-gateway" } }
#
# the extracted chain is [zylos-gateway, zylos-internal-cart].
#
# NOTE: Keycloak's ActClaimMapper (zylos-infra-keycloak-extensions) currently
# populates single-hop act only. Multi-hop chains are a Phase 2 item. Write
# permittedChains accordingly (typically single-element chains in Phase 1).
###############################################################################

defaults:
  # standard: an unlisted path permits any authenticated caller. Chain
  # enforcement is opt-in per endpoint. Set to true for allowlist semantics
  # (every reachable endpoint must be enumerated, unlisted paths denied).
  rejectIfNoPathMatch: false

  # On chain-sensitive endpoints, reject tokens with no act claim. Only
  # relevant when chainSensitive: true.
  allowEmptyChain: false

  # Defense-in-depth ceiling on chain length for chain-sensitive endpoints.
  maxChainDepth: 5

endpoints:

  # Public endpoint — no authentication required.
  - pathPattern: /api/v1/hello/public
    publicAccess: true

  # Non-sensitive authenticated endpoints. These lines are optional under
  # standard defaults (an unlisted path behaves identically), but
  # listing them documents intent and survives a switch to strict defaults.
  - pathPattern: /api/v1/hello/me
    chainSensitive: false

  - pathPattern: /api/v1/cart/**
    chainSensitive: false

  # -------------------------------------------------------------------------
  # Chain-sensitive endpoints. The actor chain MUST match one of the permitted
  # chains. Use for payment, refund, admin, seller-payout, PII-export, and
  # account-state-mutation routes (per the sensitivity taxonomy in ADR 0003).
  # -------------------------------------------------------------------------

  - pathPattern: /api/v1/payments/**
    chainSensitive: true
    permittedChains:
      - [ zylos-gateway ]

  - pathPattern: /api/v1/refunds/**
    chainSensitive: true
    permittedChains:
      - [ zylos-gateway ]

  - pathPattern: /api/v1/admin/**
    chainSensitive: true
    permittedChains:
      - [ zylos-gateway ]
